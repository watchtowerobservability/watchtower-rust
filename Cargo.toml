[package]
name = "watchtower-sdk"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/watchtowerobservability/watchtower-rust"
description = "Thin Watchtower distribution over the OpenTelemetry Rust SDK"

# Own workspace: this crate is published separately and must not add deps to the platform build.
[workspace]

[dependencies]
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["trace", "logs", "metrics"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "trace", "logs", "metrics", "reqwest-rustls"] }
http = { version = "1", optional = true }
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "perf"], optional = true }
serde_json = { version = "1", optional = true }
# MIT; look-around and back-references for WAF rules the regex crate rejects
fancy-regex = { version = "0.14", optional = true }
tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }
tracing = { version = "0.1", optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
# Apache-2.0; `tracing` events as OTel log records, with the ids of tracing-opentelemetry spans
opentelemetry-appender-tracing = { version = "0.31", features = ["experimental_use_tracing_span_context", "experimental_metadata_attributes"], optional = true }
actix-web = { version = "4.9", default-features = false, optional = true }
backtrace = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
# datastores (xxhash-rust is BSL-1.0, same as the worker); pure Rust except heed (LMDB C, builds on MSVC)
xxhash-rust = { version = "0.8", features = ["xxh3"], optional = true }
sled = { version = "0.34", optional = true }
redb = { version = "4", features = ["cache_metrics"], optional = true }
heed = { version = "0.23", optional = true }
moka = { version = "0.12", features = ["sync"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[features]
# Integrations are opt-in so the base crate stays small.
tracing = ["dep:tracing", "dep:tracing-opentelemetry", "dep:tracing-subscriber", "dep:opentelemetry-appender-tracing"]
tower = ["dep:http", "dep:tower-layer", "dep:tower-service"]  # axum, tonic, hyper services
actix = ["dep:actix-web"]
appsec = ["tower", "dep:regex", "dep:fancy-regex", "dep:serde_json", "dep:reqwest"]  # in-app WAF (tower layer)
profiling = ["dep:backtrace", "dep:reqwest", "dep:libc"]  # CPU profiler (SIGPROF on Unix, suspend+unwind on Windows x64 and arm64)
# Embedded datastores: spans, wt.embedded.* metrics, SQL hash (rusqlite via Connection::profile, RocksDB via a property closure)
datastores = ["dep:xxhash-rust"]
sled = ["datastores", "dep:sled"]
redb = ["datastores", "dep:redb"]
heed = ["datastores", "dep:heed"]
moka = ["datastores", "dep:moka"]

[dev-dependencies]
opentelemetry_sdk = { version = "0.31", features = ["trace", "logs", "metrics", "testing"] }
tokio = { version = "1", features = ["rt", "macros"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json = "1"
tempfile = "3"
