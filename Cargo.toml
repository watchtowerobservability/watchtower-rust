[package]
name = "watchtower-sdk"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/watchtowerobservability/watchtower-rust"
description = "Thin Watchtower distribution over the OpenTelemetry Rust SDK"

# Own workspace: this crate is published separately and must not add deps to the platform build.
[workspace]

[dependencies]
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["trace"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "trace", "reqwest-rustls"] }
http = { version = "1", optional = true }
tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }
tracing = { version = "0.1", optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
actix-web = { version = "4.9", default-features = false, optional = true }

[features]
# Integrations are opt-in so the base crate stays small.
tracing = ["dep:tracing", "dep:tracing-opentelemetry", "dep:tracing-subscriber"]
tower = ["dep:http", "dep:tower-layer", "dep:tower-service"]  # axum, tonic, hyper services
actix = ["dep:actix-web"]

[dev-dependencies]
opentelemetry_sdk = { version = "0.31", features = ["trace", "testing"] }
tokio = { version = "1", features = ["rt", "macros"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
